# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && xcodegen
# Change BASE_BUNDLE_ID (and set DEVELOPMENT_TEAM) once; everything else derives from it.
name: SugarLink
options:
  createIntermediateGroups: true
  createDefaultSchemes: true
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    BASE_BUNDLE_ID: com.anishhm.sugartracker
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  SugarLinkWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Sugar Link
        WKApplication: true
        WKWatchOnly: true
        NSHealthShareUsageDescription: Sugar Link reads today's step count to show it next to your glucose.
        AppGroupID: $(APP_GROUP_ID)
        KeychainGroup: $(AppIdentifierPrefix)$(BASE_BUNDLE_ID).shared
    entitlements:
      path: Watch/SugarLinkWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BASE_BUNDLE_ID).shared]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SugarLinkWidgets
      - sdk: HealthKit.framework

  SugarLinkWidgets:
    type: app-extension
    platform: watchOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Sugar Link
        AppGroupID: $(APP_GROUP_ID)
        KeychainGroup: $(AppIdentifierPrefix)$(BASE_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/SugarLinkWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BASE_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp.widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Sugar Link:
    build:
      targets:
        SugarLinkWatch: all
        SugarLinkWidgets: all
    run:
      config: Debug
      executable: SugarLinkWatch
    archive:
      config: Release
